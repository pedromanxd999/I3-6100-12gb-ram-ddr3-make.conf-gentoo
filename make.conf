# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.

# GCC Compiler Flags
COMMON_FLAGS="-O2 -pipe -march=skylake -mtune=skylake"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# CPU Flags
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt sse sse2 sse3 sse4_1 sse4_2 ssse3"

# Use Flags
USE="X acl alsa amd64 berkdb bzip2 cli crypt dbus dri ffmpeg gdbm iconv ipv6 kde libnotify multilib ncurses nls nptl openmp pam pcre readline seccomp ssl systemd tcpd udev unicode wayland xattr zlib -gnome -gtk -gtk2 -gtk3 -qt4 -consolekit -openrc"

# Portage Features
FEATURES="parallel-fetch parallel-install clean-logs splitdebug"

# Portage Directories
PORTDIR="/usr/portage"
DISTDIR="/usr/portage/distfiles"
PKGDIR="/usr/portage/packages"

# Compilation Settings
MAKEOPTS="-j3"
EMERGE_DEFAULT_OPTS="—jobs=3 —load-average=3.0"

# Language Settings
LINGUAS="en_US"
L10N="en-US"

# Input Devices
INPUT_DEVICES="libinput synaptics"

# Video Card
VIDEO_CARDS="intel i965"

# Audio
ALSA_CARDS="hda-intel"

# KDE Plasma
USE="${USE} plasma activities declarative dbus kde kwallet phonon plasma policykit qml semantic-desktop widgets xattr"

# Wayland
USE="${USE} egl gbm gles2 wayland"

# XFS File System
USE="${USE} xfs"

# Systemd
USE="${USE} systemd -consolekit -openrc"

# Intel CPU
USE="${USE} mmx sse sse2 sse3 ssse3 sse4_1 sse4_2"

# Networking
USE="${USE} ipv6 networkmanager"

# Multimedia
USE="${USE} aac alsa cdda cdr dvd ffmpeg flac gif jpeg mp3 mp4 mpeg ogg png svg tiff vorbis wav webp x264 xvid"

# Hardware Acceleration
USE="${USE} vaapi vdpau"

# Security
USE="${USE} caps crypt ssl"

# Compression
USE="${USE} bzip2 gzip lzma lzo xz zip zlib"

# Database
USE="${USE} sqlite"

# Development
USE="${USE} git subversion"

# Internationalization
USE="${USE} nls unicode"

# Printing
USE="${USE} cups"

# Power Management
USE="${USE} acpi"

# Misc
USE="${USE} dbus policykit udisks upower"

# Package-specific USE flags
USE="${USE} libnotify pulseaudio"

# Portage Configuration
ACCEPT_KEYWORDS="amd64"
ACCEPT_LICENSE="* -@EULA"

# Mirrors
GENTOO_MIRRORS="http://gentoo.osuosl.org/ http://www.gtlib.gatech.edu/pub/gentoo"

# Synchronization
SYNC="rsync://rsync.gentoo.org/gentoo-portage"

# Logging
PORTAGE_ELOG_CLASSES="log warn error info"
PORTAGE_ELOG_SYSTEM="save_summary:log,warn,error,info echo"

# Binary Packages
FEATURES="${FEATURES} buildpkg"

# Ccache
FEATURES="${FEATURES} ccache"
CCACHE_DIR="/var/cache/ccache"
CCACHE_SIZE="5G"

# Distcc
#FEATURES="${FEATURES} distcc"
#DISTCC_HOSTS="localhost"

# Portage Nice Level
PORTAGE_NICENESS="19"

# Emerge Default Opts
EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} —ask —verbose=y —keep-going"

# Package Output
PORTAGE_TMPDIR="/var/tmp"
BUILD_PREFIX="/var/tmp/portage"

# Fetch Command
FETCHCOMMAND="/usr/bin/wget -t 3 -T 60 —passive-ftp -O \"\${DISTDIR}/\${FILE}\" \"\${URI}\""
RESUMECOMMAND="/usr/bin/wget -c -t 3 -T 60 —passive-ftp -O \"\${DISTDIR}/\${FILE}\" \"\${URI}\""

# Rsync Options
PORTAGE_RSYNC_OPTS="—recursive —links —safe-links —perms —times —omit-dir-times —compress —force —whole-file —delete —stats —human-readable —timeout=180 —exclude=/distfiles —exclude=/local —exclude=/packages —exclude=/.git"

# Emerge Options
EMERGE_DEFAULT_OPTS="${EMERGE_DEFAULT_OPTS} —binpkg-respect-use=y —getbinpkg=y"

# Package Collision Protection
FEATURES="${FEATURES} protect-owned collision-protect"

# Binary Package Hosts
#PORTAGE_BINHOST="http://packages.gentoo.org/package/amd64-stable"

# Gentoo Config Protect
CONFIG_PROTECT="/etc /usr/share/gnupg/qualified.txt"
CONFIG_PROTECT_MASK="/etc/ca-certificates.conf /etc/env.d /etc/gconf /etc/gentoo-release /etc/revdep-rebuild /etc/sandbox.d /etc/terminfo"

# Package Management
FEATURES="${FEATURES} unmerge-orphans"

# Portage Output
PORTAGE_VERBOSE="1"

# Compression Type for Binary Packages
BINPKG_COMPRESS="xz"

# Compiler Cache
CCACHE_SIZE="5G"

# Distfiles
DISTDIR="/usr/portage/distfiles"

# Portage Temporary Directory
PORTAGE_TMPDIR="/var/tmp"

